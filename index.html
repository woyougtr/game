<!DOCTYPE html>
<html lang="zh-CM">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMax API 使用情况</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card h3 {
            color: #00d2ff;
            margin-bottom: 16px;
            font-size: 1.2rem;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-label {
            color: #888;
        }
        .stat-value {
            font-weight: bold;
            color: #fff;
        }
        .progress-bar {
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 16px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 12px;
            transition: width 0.5s ease;
        }
        .progress-fill.session {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            width: 8%;
        }
        .progress-fill.week {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            width: 4.5%;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        .chart-container h3 {
            color: #00d2ff;
            margin-bottom: 20px;
            text-align: center;
        }
        .time-info {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }
        .warning {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            color: #ffc107;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 MiniMax API 使用情况</h1>
        <p class="subtitle">MiniMax-M2.5 模型</p>
        
        <div class="cards">
            <div class="card">
                <h3>📊 本次会话</h3>
                <div class="stat">
                    <span class="stat-label">剩余次数</span>
                    <span class="stat-value">552 次</span>
                </div>
                <div class="stat">
                    <span class="stat-label">已用次数</span>
                    <span class="stat-value">48 次</span>
                </div>
                <div class="stat">
                    <span class="stat-label">总次数</span>
                    <span class="stat-value">600 次</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill session"></div>
                </div>
                <p style="text-align: center; margin-top: 8px; color: #00d2ff9">已用 8%</p>
            </div>
            
            <div class="card">
                <h3>📅 本周</h3>
                <div class="stat">
                    <span class="stat-label">剩余次数</span>
                    <span class="stat-value">5,728 次</span>
                </div>
                <div class="stat">
                    <span class="stat-label">已用次数</span>
                    <span class="stat-value">272 次</span>
                </div>
                <div class="stat">
                    <span class="stat-label">总次数</span>
                    <span class="stat-value">6,000 次</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill week"></div>
                </div>
                <p style="text-align: center; margin-top: 8px; color: #f5576c;">已用 4.5%</p>
            </div>
        </div>
        
        <div class="chart-container">
            <h3>📈 使用量可视化</h3>
            <canvas id="usageChart" height="300"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>💰 剩余额度分布</h3>
            <canvas id="pieChart" height="250"></canvas>
        </div>
        
        <div class="warning">
            ⚠️ 数据更新时间: 2026-03-18 00:57 (UTC+8)
        </div>
        
        <p class="time-info">
            由 AI 助手 🦞 自动生成
        </p>
    </div>
    
    <script>
        // 柱状图
        const barCtx = document.getElementById('usageChart').getContext('2d');
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: ['本次会话', '本周'],
                datasets: [{
                    label: '已用 (次)',
                    data: [48, 272],
                    backgroundColor: ['rgba(0, 210, 255, 0.8)', 'rgba(245, 87, 108, 0.8)'],
                    borderColor: ['#00d2ff', '#f5576c'],
                    borderWidth: 2,
                    borderRadius: 8
                }, {
                    label: '剩余 (次)',
                    data: [552, 5728],
                    backgroundColor: ['rgba(0, 210, 255, 0.3)', 'rgba(245, 87, 108, 0.3)'],
                    borderColor: ['#00d2ff', '#f5576c'],
                    borderWidth: 2,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: '#fff' }
                    }
                },
                scales: {
                    x : {
                        ticks: { color: '#888' },
                        grid: { color: 'rgba(255,255,255,0.1)' }
                    },
                    y: {
                        ticks: { color: '#888', },
                        grid: { color: 'rgba(255,255,255,0.1)' }
                    }
                }
            }
          });
        
        // 夗直文函
.
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        new Chart(pieCtx, {
            type: 'doughnut',
            data: {
                labels: ['本次会话剩余', '本周剩余'],
                datasets: [{
                    data: [552, 5728],
                    backgroundColor: ['#00d2ff', '#f093fb'],
                    borderColor: ['#1a1a2e', '#1a1a2e'],
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#fff', padding: 20 }
                    }
                }
            }
        });
    </script>
</body>
</html>
