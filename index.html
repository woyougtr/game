<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏记分 - 实时同步</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffd700;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        /* 加入房间 */
        .join-screen input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .join-screen input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #4CAF50;
            color: #fff;
            margin-bottom: 10px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: #2196F3;
        }
        .btn-danger {
            background: #f44336;
        }
        .btn-warning {
            background: #ff9800;
        }
        /* 游戏画面 */
        .room-info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .player-list {
            display: grid;
            gap: 15px;
        }
        .player-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-name {
            font-size: 20px;
            font-weight: bold;
        }
        .player-score {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
        }
        .player-score.negative {
            color: #f44336;
        }
        .player-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .player-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-add {
            background: #4CAF50;
            color: #fff;
        }
        .btn-sub {
            background: #f44336;
            color: #fff;
        }
        .score-input-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .score-input-modal.active {
            display: flex;
        }
        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content h3 {
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-content input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-align: center;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }
        /* 清算画面 */
        .settlement {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .settlement-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .settlement-item:last-child {
            border-bottom: none;
        }
        .settlement-from {
            color: #f44336;
        }
        .settlement-to {
            color: #4CAF50;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-buttons button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        /* 创建房间 */
        .create-room {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .create-room a {
            color: #2196F3;
            text-decoration: none;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            padding: 15px 30px;
            border-radius: 10px;
            display: none;
            z-index: 2000;
        }
        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 加入房间画面 -->
        <div id="joinScreen" class="screen active">
            <h1>🎮 游戏记分</h1>
            <div class="join-screen">
                <input type="text" id="roomCode" placeholder="输入房间号" maxlength="6">
                <input type="text" id="playerName" placeholder="你的名字" maxlength="10">
                <button class="btn" onclick="joinRoom()">加入房间</button>
                <button class="btn btn-secondary" onclick="showCreateRoom()">创建新房</button>
            </div>
        </div>

        <!-- 游戏画面 -->
        <div id="gameScreen" class="screen">
            <div class="room-info">
                <div>房间号: <strong id="displayRoomCode"></strong></div>
                <div>玩家: <strong id="displayPlayerName"></strong></div>
            </div>
            <div id="playerList" class="player-list"></div>
            <div class="action-buttons">
                <button class="btn btn-warning" onclick="showSettlement()">💰 清算</button>
                <button class="btn btn-danger" onclick="leaveRoom()">离开</button>
            </div>
        </div>

        <!-- 清算画面 -->
        <div id="settlementScreen" class="screen">
            <h1>💰 清算方案</h1>
            <div id="settlementList"></div>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="backToGame()">返回</button>
                <button class="btn btn-danger" onclick="resetGame()">重新开始</button>
            </div>
        </div>
    </div>

    <!-- 记分弹窗 -->
    <div id="scoreModal" class="score-input-modal">
        <div class="modal-content">
            <h3 id="scoreModalTitle">给谁记分</h3>
            <input type="number" id="scoreInput" placeholder="输入分数" inputmode="numeric">
            <div class="modal-buttons">
                <button class="btn btn-sub" onclick="submitScore(-1)">-1</button>
                <button class="btn btn-sub" onclick="submitScore(-5)">-5</button>
                <button class="btn btn-add" onclick="submitScore(5)">+5</button>
                <button class="btn btn-add" onclick="submitScore(10)">+10</button>
            </div>
            <div class="modal-buttons" style="margin-top: 10px;">
                <button class="btn btn-secondary" onclick="showCustomInput()">自定义</button>
                <button class="btn btn-danger" onclick="closeScoreModal()">取消</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let ws = null;
        let currentRoom = '';
        let currentPlayer = '';
        let players = {};
        let targetPlayer = '';

        // WebSocket 连接
        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                console.log('Connected to server');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = () => {
                showToast('连接断开，正在重连...');
                setTimeout(connectWS, 3000);
            };
        }

        // 处理消息
        function handleMessage(data) {
            switch (data.type) {
                case 'roomPlayers':
                    players = data.players;
                    renderPlayers();
                    break;
                case 'playerJoined':
                    showToast(`${data.name} 加入了房间`);
                    break;
                case 'playerLeft':
                    showToast(`${data.name} 离开了房间`);
                    break;
                case 'scoreUpdated':
                    players = data.players;
                    renderPlayers();
                    break;
                case 'settlement':
                    showSettlementResult(data.settlement);
                    break;
                case 'gameReset':
                    players = data.players;
                    showToast('游戏已重新开始');
                    backToGame();
                    renderPlayers();
                    break;
                case 'error':
                    showToast(data.message);
                    break;
            }
        }

        // 加入房间
        function joinRoom() {
            const roomCode = document.getElementById('roomCode').value.trim();
            const playerName = document.getElementById('playerName').value.trim();
            
            if (!roomCode || !playerName) {
                showToast('请输入房间号和名字');
                return;
            }

            currentRoom = roomCode;
            currentPlayer = playerName;

            ws.send(JSON.stringify({
                type: 'join',
                roomCode,
                playerName
            }));

            showScreen('gameScreen');
            document.getElementById('displayRoomCode').textContent = roomCode;
            document.getElementById('displayPlayerName').textContent = playerName;
        }

        // 显示创建房间
        function showCreateRoom() {
            const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('roomCode').value = roomCode;
            showToast(`已生成房间号: ${roomCode}`);
        }

        // 渲染玩家列表
        function renderPlayers() {
            const list = document.getElementById('playerList');
            list.innerHTML = '';
            
            Object.entries(players).forEach(([name, data]) => {
                const isMe = name === currentPlayer;
                const scoreClass = data.score < 0 ? 'negative' : '';
                
                list.innerHTML += `
                    <div class="player-card">
                        <div>
                            <div class="player-name">${name} ${isMe ? '(你)' : ''}</div>
                            <div class="player-score ${scoreClass}">${data.score}</div>
                        </div>
                        ${!isMe ? `
                        <div class="player-actions">
                            <button class="btn-add" onclick="openScoreModal('${name}')">记分</button>
                        </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        // 打开记分弹窗
        function openScoreModal(playerName) {
            targetPlayer = playerName;
            document.getElementById('scoreModalTitle').textContent = `给 ${playerName} 记分`;
            document.getElementById('scoreInput').value = '';
            document.getElementById('scoreModal').classList.add('active');
        }

        // 关闭记分弹窗
        function closeScoreModal() {
            document.getElementById('scoreModal').classList.remove('active');
        }

        // 提交分数
        function submitScore(score) {
            const input = document.getElementById('scoreInput').value;
            if (input) {
                score = parseInt(input) * Math.sign(score);
            }
            
            if (score === 0) {
                showToast('分数不能为0');
                return;
            }

            ws.send(JSON.stringify({
                type: 'updateScore',
                roomCode: currentRoom,
                playerName: currentPlayer,
                targetPlayer: targetPlayer,
                score: score
            }));

            closeScoreModal();
        }

        // 显示自定义输入
        function showCustomInput() {
            document.getElementById('scoreInput').focus();
        }

        // 清算
        function showSettlement() {
            ws.send(JSON.stringify({
                type: 'settlement',
                roomCode: currentRoom
            }));
        }

        // 显示清算结果
        function showSettlementResult(settlement) {
            const list = document.getElementById('settlementList');
            list.innerHTML = '';
            
            if (settlement.length === 0) {
                list.innerHTML = '<div class="settlement">已结清，无需清算</div>';
            } else {
                settlement.forEach(item => {
                    list.innerHTML += `
                        <div class="settlement">
                            <div class="settlement-item">
                                <span class="settlement-from">${item.from}</span>
                                <span>→</span>
                                <span class="settlement-to">${item.to}</span>
                            </div>
                            <div class="settlement-item" style="justify-content: center; font-size: 24px;">
                                <strong>${item.amount}</strong>
                            </div>
                        </div>
                    `;
                });
            }
            
            showScreen('settlementScreen');
        }

        // 返回游戏
        function backToGame() {
            showScreen('gameScreen');
        }

        // 重新开始
        function resetGame() {
            ws.send(JSON.stringify({
                type: 'resetGame',
                roomCode: currentRoom
            }));
        }

        // 离开房间
        function leaveRoom() {
            ws.send(JSON.stringify({
                type: 'leave',
                roomCode: currentRoom,
                playerName: currentPlayer
            }));
            currentRoom = '';
            currentPlayer = '';
            players = {};
            showScreen('joinScreen');
        }

        // 切换画面
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 初始化
        connectWS();
    </script>
</body>
</html>
