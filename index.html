<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏记分 - 实时同步</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #ffd700; }
        .screen { display: none; }
        .screen.active { display: block; }
        .join-screen input {
            width: 100%; padding: 15px; font-size: 18px;
            border: none; border-radius: 10px; margin-bottom: 15px;
            background: rgba(255,255,255,0.1); color: #fff;
        }
        .join-screen input::placeholder { color: rgba(255,255,255,0.5); }
        .btn {
            width: 100%; padding: 15px; font-size: 18px;
            border: none; border-radius: 10px; cursor: pointer;
            background: #4CAF50; color: #fff; margin-bottom: 10px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #2196F3; }
        .btn-danger { background: #f44336; }
        .btn-warning { background: #ff9800; }
        .room-info {
            background: rgba(255,255,255,0.1); padding: 15px;
            border-radius: 10px; margin-bottom: 20px; text-align: center;
        }
        .player-list { display: grid; gap: 15px; }
        .player-card {
            background: rgba(255,255,255,0.1); padding: 20px;
            border-radius: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .player-name { font-size: 20px; font-weight: bold; }
        .player-score { font-size: 32px; font-weight: bold; color: #ffd700; }
        .player-score.negative { color: #f44336; }
        .player-actions { display: flex; gap: 10px; margin-top: 10px; }
        .player-actions button {
            flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;
        }
        .btn-add { background: #4CAF50; color: #fff; }
        .btn-sub { background: #f44336; color: #fff; }
        .score-input-modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .score-input-modal.active { display: flex; }
        .modal-content {
            background: #1a1a2e; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px;
        }
        .modal-content h3 { margin-bottom: 20px; text-align: center; }
        .modal-content input {
            width: 100%; padding: 15px; font-size: 24px;
            border: none; border-radius: 10px; margin-bottom: 15px;
            background: rgba(255,255,255,0.1); color: #fff; text-align: center;
        }
        .modal-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .modal-buttons button {
            flex: 1; min-width: 70px; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px;
        }
        .settlement {
            background: rgba(255,255,255,0.1); padding: 20px;
            border-radius: 15px; margin-bottom: 15px;
        }
        .settlement-item {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .settlement-item:last-child { border-bottom: none; }
        .settlement-from { color: #f44336; }
        .settlement-to { color: #4CAF50; }
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .action-buttons button {
            flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-size: 16px;
        }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #4CAF50; padding: 15px 30px; border-radius: 10px; display: none; z-index: 2000;
        }
        .toast.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .status { text-align: center; padding: 10px; font-size: 14px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div id="joinScreen" class="screen active">
            <h1>🎮 游戏记分</h1>
            <div class="join-screen">
                <input type="text" id="roomCode" placeholder="输入房间号" maxlength="6">
                <input type="text" id="playerName" placeholder="你的名字" maxlength="10">
                <button class="btn" onclick="joinRoom()">加入房间</button>
                <button class="btn btn-secondary" onclick="showCreateRoom()">创建新房</button>
            </div>
        </div>

        <div id="gameScreen" class="screen">
            <div class="room-info">
                <div>房间号: <strong id="displayRoomCode"></strong></div>
                <div>玩家: <strong id="displayPlayerName"></strong></div>
            </div>
            <div class="status">🟢 在线</div>
            <div id="playerList" class="player-list"></div>
            <div class="action-buttons">
                <button class="btn btn-warning" onclick="showSettlement()">💰 清算</button>
                <button class="btn btn-danger" onclick="leaveRoom()">离开</button>
            </div>
        </div>

        <div id="settlementScreen" class="screen">
            <h1>💰 清算方案</h1>
            <div id="settlementList"></div>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="backToGame()">返回</button>
                <button class="btn btn-danger" onclick="resetGame()">重新开始</button>
            </div>
        </div>
    </div>

    <div id="scoreModal" class="score-input-modal">
        <div class="modal-content">
            <h3 id="scoreModalTitle">给谁记分</h3>
            <input type="number" id="scoreInput" placeholder="输入分数" inputmode="numeric">
            <div class="modal-buttons">
                <button class="btn btn-sub" onclick="submitScore(-1)">-1</button>
                <button class="btn btn-sub" onclick="submitScore(-5)">-5</button>
                <button class="btn btn-add" onclick="submitScore(5)">+5</button>
                <button class="btn btn-add" onclick="submitScore(10)">+10</button>
            </div>
            <div class="modal-buttons" style="margin-top: 10px;">
                <button class="btn btn-secondary" style="flex:2" onclick="showCustomInput()">自定义</button>
                <button class="btn btn-danger" onclick="closeScoreModal()">取消</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_BASE = window.location.origin;
        let currentRoom = '';
        let currentPlayer = '';
        let players = {};
        let targetPlayer = '';
        let pollInterval = null;

        // 轮询获取房间状态
        async function pollRoom() {
            if (!currentRoom || !currentPlayer) return;
            
            try {
                const res = await fetch(`${API_BASE}/api/room/${currentRoom}`);
                const data = await res.json();
                
                if (data.players) {
                    const oldPlayers = JSON.stringify(players);
                    players = data.players;
                    
                    // 检测玩家加入/离开
                    const newPlayers = Object.keys(players);
                    const oldKeys = Object.keys(JSON.parse(oldPlayers));
                    
                    newPlayers.forEach(p => {
                        if (!oldKeys.includes(p) && p !== currentPlayer) {
                            showToast(`${p} 加入了房间`);
                        }
                    });
                    oldKeys.forEach(p => {
                        if (!newPlayers.includes(p) && p !== currentPlayer) {
                            showToast(`${p} 离开了房间`);
                        }
                    });
                    
                    renderPlayers();
                }
            } catch (e) {
                console.error('Poll error:', e);
            }
        }

        // 开始轮询
        function startPolling() {
            pollRoom();
            pollInterval = setInterval(pollRoom, 2000);
        }

        // 停止轮询
        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        // 加入房间
        async function joinRoom() {
            const roomCode = document.getElementById('roomCode').value.trim();
            const playerName = document.getElementById('playerName').value.trim();
            
            if (!roomCode || !playerName) {
                showToast('请输入房间号和名字');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomCode, playerName })
                });
                const data = await res.json();
                
                if (data.error) {
                    showToast(data.error);
                    return;
                }

                currentRoom = roomCode;
                currentPlayer = playerName;
                players = data.players || {};

                showScreen('gameScreen');
                document.getElementById('displayRoomCode').textContent = roomCode;
                document.getElementById('displayPlayerName').textContent = playerName;
                
                startPolling();
            } catch (e) {
                showToast('连接失败，请检查网络');
            }
        }

        // 创建新房
        function showCreateRoom() {
            const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('roomCode').value = roomCode;
            showToast(`已生成房间号: ${roomCode}`);
        }

        // 渲染玩家列表
        function renderPlayers() {
            const list = document.getElementById('playerList');
            list.innerHTML = '';
            
            Object.entries(players).forEach(([name, data]) => {
                const isMe = name === currentPlayer;
                const scoreClass = data.score < 0 ? 'negative' : '';
                
                list.innerHTML += `
                    <div class="player-card">
                        <div>
                            <div class="player-name">${name} ${isMe ? '(你)' : ''}</div>
                            <div class="player-score ${scoreClass}">${data.score}</div>
                        </div>
                        ${!isMe ? `
                        <div class="player-actions">
                            <button class="btn-add" onclick="openScoreModal('${name}')">记分</button>
                        </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        // 打开记分弹窗
        function openScoreModal(playerName) {
            targetPlayer = playerName;
            document.getElementById('scoreModalTitle').textContent = `给 ${playerName} 记分`;
            document.getElementById('scoreInput').value = '';
            document.getElementById('scoreModal').classList.add('active');
        }

        // 关闭记分弹窗
        function closeScoreModal() {
            document.getElementById('scoreModal').classList.remove('active');
        }

        // 提交分数 - 你给别多少，自己扣多少
        async function submitScore(score) {
            const input = document.getElementById('scoreInput').value;
            if (input) {
                score = parseInt(input);
                if (isNaN(score) || score === 0) {
                    showToast('请输入有效分数');
                    return;
                }
            }
            
            try {
                // 给目标玩家加分数，自己扣分数
                await fetch(`${API_BASE}/api/score`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomCode: currentRoom,
                        playerName: currentPlayer,
                        targetPlayer: targetPlayer,
                        score: score
                    })
                });
                
                // 给自己扣分
                await fetch(`${API_BASE}/api/score`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomCode: currentRoom,
                        playerName: currentPlayer,
                        targetPlayer: currentPlayer,
                        score: -score
                    })
                });
                
                closeScoreModal();
                pollRoom();
            } catch (e) {
                showToast('记分失败');
            }
        }

        // 显示自定义输入
        function showCustomInput() {
            document.getElementById('scoreInput').focus();
        }

        // 清算
        async function showSettlement() {
            try {
                const res = await fetch(`${API_BASE}/api/settlement/${currentRoom}`);
                const data = await res.json();
                showSettlementResult(data.settlement || []);
            } catch (e) {
                showToast('清算失败');
            }
        }

        // 显示清算结果
        function showSettlementResult(settlement) {
            const list = document.getElementById('settlementList');
            list.innerHTML = '';
            
            if (!settlement || settlement.length === 0) {
                list.innerHTML = '<div class="settlement">已结清，无需清算</div>';
            } else {
                settlement.forEach(item => {
                    list.innerHTML += `
                        <div class="settlement">
                            <div class="settlement-item">
                                <span class="settlement-from">${item.from}</span>
                                <span>→</span>
                                <span class="settlement-to">${item.to}</span>
                            </div>
                            <div class="settlement-item" style="justify-content: center; font-size: 24px;">
                                <strong>${item.amount}</strong>
                            </div>
                        </div>
                    `;
                });
            }
            
            showScreen('settlementScreen');
        }

        // 返回游戏
        function backToGame() {
            showScreen('gameScreen');
        }

        // 重新开始
        async function resetGame() {
            try {
                await fetch(`${API_BASE}/api/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomCode: currentRoom })
                });
                showToast('游戏已重新开始');
                backToGame();
                pollRoom();
            } catch (e) {
                showToast('重置失败');
            }
        }

        // 离开房间
        async function leaveRoom() {
            stopPolling();
            currentRoom = '';
            currentPlayer = '';
            players = {};
            showScreen('joinScreen');
        }

        // 切换画面
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // 显示提示
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
